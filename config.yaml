# RM Investor — configuration.
# Everything here is tunable. Scoring weights, valuation assumptions, the scan
# universe, and which data provider backs each capability all live in this file.

# ---------------------------------------------------------------------------
# Which adapter backs each data capability. Swap these as you add paid keys.
# Options: price -> yfinance | fundamentals -> yfinance,alphavantage
#          ratings -> yfinance,finnhub | news -> yfinance,finnhub,alphavantage
# The registry tries the primary, then falls back to yfinance where possible.
# ---------------------------------------------------------------------------
providers:
  price: yfinance
  fundamentals: yfinance
  ratings: fmp                  # FMP price targets + grades (fallback: yfinance)
  news: yfinance                # yfinance news (free, unlimited — saves FMP quota)
  smart_money: [fmp_congress, sec_edgar]   # FMP congress trades (bulk) + SEC 13F

# Cache TTLs (seconds) — keep free tiers happy.
cache:
  http_ttl_seconds: 900          # 15 min, matches delayed quotes
  quote_ttl_seconds: 900
  fundamentals_ttl_seconds: 86400
  ratings_ttl_seconds: 43200
  news_ttl_seconds: 3600
  filings_ttl_seconds: 604800

portfolio:
  csv_path: holdings.csv

universe:
  watchlist: [AAPL, MSFT, NVDA, GOOGL, AMZN, META, TSLA, AMD, AVGO, JPM, XOM, UNH]
  index_csv: rm_investor/data/sp500_sample.csv
  max_size: 15                   # bounded to respect FMP free-tier (250/day)
  include_smart_money_buys: true

moonshot:
  universe_csv: rm_investor/data/smallcap_sample.csv
  max_market_cap: 3000000000     # $3B ceiling — small/micro-cap only
  max_size: 15

# ---------------------------------------------------------------------------
# Valuation assumptions — DCF is sensitive to these; they are shown in the UI.
# ---------------------------------------------------------------------------
valuation:
  discount_rate: 0.10            # required return / hurdle rate (base case)
  terminal_growth: 0.025         # long-run growth after the projection window
  projection_years: 5
  default_growth: 0.08           # used when a company's own growth is unknown
  max_growth: 0.20               # cap runaway extrapolation (see growth_fade)
  # A single flat 20% cap was binding on ~2/3 of DCF-able holdings, flattening a
  # 25%-grower and a 60%-grower into the same value. Instead, let high growth through
  # but FADE it toward terminal growth across the projection window - the standard
  # fix, and more honest than either extrapolating or truncating.
  growth_fade:
    enabled: true
    max_initial_growth: 0.40     # ceiling on year-1 growth (still guards absurd inputs)
    fade_to: 0.04                # growth decays toward this by the final year
  # Risk-adjusted discount rate: a speculative micro-cap should not be discounted at
  # the same 10% as a mega-cap. Adjustments are additive and clamped.
  discount_adjust:
    enabled: true
    small_cap_threshold: 2.0e9   # below this market cap, add the premium
    small_cap_premium: 0.03
    micro_cap_threshold: 3.0e8
    micro_cap_premium: 0.05      # replaces (not adds to) the small-cap premium
    no_profit_premium: 0.02      # unprofitable (negative trailing EPS)
    min_rate: 0.07
    max_rate: 0.20
  # yfinance's freeCashflow is intermittently wrong by an order of magnitude for
  # large caps (e.g. MSFT reporting ~$16B against ~$180B operating cash flow), which
  # produced absurd DCF values. If FCF looks implausibly small next to OCF, fall back
  # to a conservative fraction of OCF and record why in the inputs.
  fcf_sanity:
    enabled: true
    min_fcf_to_ocf: 0.25         # FCF below this fraction of OCF is treated as bad data
    ocf_fallback_ratio: 0.65     # conservative FCF estimate = 65% of operating cash flow
  multiples:                     # fallback market-median target multiples
    pe: 18.0
    ps: 3.0
    pb: 2.5
    ev_ebitda: 12.0
  # Sector-specific target multiples. Applying one market median (P/E 18, P/S 3) to
  # every company is the single biggest source of fair-value distortion: it values a
  # hypergrowth software name and a utility identically. Any sector not listed falls
  # back to `multiples` above. Keys match yfinance `sector` strings.
  sector_multiples:
    Technology:              {pe: 28.0, ps: 6.0,  pb: 6.0,  ev_ebitda: 20.0}
    Communication Services:  {pe: 22.0, ps: 4.0,  pb: 3.5,  ev_ebitda: 14.0}
    Healthcare:              {pe: 24.0, ps: 4.5,  pb: 4.0,  ev_ebitda: 16.0}
    Consumer Cyclical:       {pe: 20.0, ps: 2.0,  pb: 3.5,  ev_ebitda: 13.0}
    Consumer Defensive:      {pe: 20.0, ps: 1.5,  pb: 3.5,  ev_ebitda: 13.0}
    Industrials:             {pe: 20.0, ps: 2.2,  pb: 3.5,  ev_ebitda: 14.0}
    Financial Services:      {pe: 14.0, ps: 3.0,  pb: 1.6,  ev_ebitda: 12.0}
    Energy:                  {pe: 12.0, ps: 1.2,  pb: 1.8,  ev_ebitda: 6.5}
    Basic Materials:         {pe: 15.0, ps: 1.5,  pb: 2.0,  ev_ebitda: 9.0}
    Utilities:               {pe: 18.0, ps: 2.5,  pb: 2.0,  ev_ebitda: 11.0}
    Real Estate:             {pe: 30.0, ps: 6.0,  pb: 2.0,  ev_ebitda: 18.0}
  # Growth tilt: a faster-growing company deserves a higher multiple than its sector
  # median (and vice versa). Multiplier is clamped to [min, max] so it refines the
  # sector target without letting extrapolation run away.
  growth_multiple_adjust:
    enabled: true
    baseline_growth: 0.08        # growth already priced into the sector median
    sensitivity: 2.0             # multiple scales by 1 + sensitivity*(g - baseline)
    min_factor: 0.7
    max_factor: 1.8
  method_weights: {dcf: 0.40, multiples: 0.40, ddm: 0.20}
  # per-ticker overrides, e.g.  overrides: {AAPL: {default_growth: 0.06}}
  overrides: {}

# ---------------------------------------------------------------------------
# Deterministic scoring. Each factor is 0-100; weights sum to ~1.0 per profile.
# ---------------------------------------------------------------------------
scoring:
  # Concentration factor anchors (position weight as % of book). Defaults assume a
  # diversified book — ~1% is equal weight across ~100 names, 15% is a large bet.
  # NOTE: unrealized P&L is deliberately NOT scored. Cost basis says when you bought,
  # not what the stock will do next; scoring it just formalises the disposition effect.
  concentration:
    low_pct: 1.0                 # ~equal weight -> 30 (mild)
    high_pct: 15.0               # large single bet -> 90 (strong trim case)
  sell:
    weights:
      price_vs_target: 0.15
      overvaluation: 0.20
      pe_stretch: 0.10
      momentum_overbought: 0.15
      analyst_deterioration: 0.15
      concentration: 0.10
      news_negative: 0.075
      smart_money_selling: 0.075
    bands: {sell: 67, trim: 45}   # >=67 SELL, >=45 TRIM, else HOLD
  opportunity:
    weights:
      analyst_upside: 0.25
      undervaluation: 0.25
      valuation_reasonable: 0.10
      momentum: 0.15
      news_positive: 0.10
      smart_money_buying: 0.15
    bands: {strong: 67, watch: 50}
  # Holdings Signals: two-sided verdict on stocks you ALREADY OWN.
  # conviction = buy_composite - sell_composite, ranges -100..+100.
  # Thresholds are ABSOLUTE and meaning-anchored - they are NOT tuned to produce a
  # target number of names per band. If every holding is genuinely attractive, the
  # tool should say so; a label reflects the position's own merits, not what else
  # you happen to own. Each side is a 0-100 composite where ~50 is neutral, so:
  #   |conviction| < 10  -> the buy and sell cases effectively offset (noise floor)
  #   |conviction| >= 30 -> one side is clearly dominant (e.g. buy 75 vs sell 45)
  holdings:
    bands: {strong_buy: 30, overweight: 10, underweight: -10, sell: -30}
  moonshot:
    weights:
      small_cap: 0.20
      revenue_growth: 0.25
      under_followed: 0.15
      momentum_breakout: 0.20
      accumulation: 0.20
    bands: {high: 65, medium: 45}

# ---------------------------------------------------------------------------
# Factor research (scripts/run_ic_study.py). Governs the point-in-time panel used
# to measure whether a factor actually ranks forward returns, before the weights
# above are trusted. Nothing here affects live scoring.
# ---------------------------------------------------------------------------
research:
  default_universe: holdings,sp500
  start: "2018-01-01"            # dated analyst-target coverage is dense from here
  horizons: [1, 3, 6, 12]        # forward-return horizons, months
  fresh_window_days: 90          # what counts as a "recent" analyst action
  stale_window_days: 365         # the naive rolling consensus, kept as the control
  half_life_days: 45             # recency decay applied to analyst actions
  min_names_per_date: 10         # skip cross-sections too thin to rank

smart_money:
  congress:
    house_url: https://house-stock-watcher-data.s3-us-west-2.amazonaws.com/data/all_transactions.json
    senate_url: https://senate-stock-watcher-data.s3-us-west-2.amazonaws.com/aggregate/all_transactions.json
    lookback_days: 180
    pages: 3                     # FMP bulk-congress pages per chamber (free tier: only page 0 returns)
    page_limit: 25               # FMP free-tier caps `limit` at 25; raise on paid tiers
  funds:                          # notable 13F filers (sec_edgar), by CIK
    - {name: Berkshire Hathaway, cik: "0001067983"}
    - {name: Scion Asset Mgmt (Burry), cik: "0001649339"}
    - {name: Bridgewater Associates, cik: "0001350694"}
    - {name: Pershing Square, cik: "0001336528"}
